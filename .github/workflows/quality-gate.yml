name: Quality Gate

on:
  pull_request:
    branches: [release]
  push:
    branches: [release]

permissions:
  contents: read

jobs:
  fallow:
    name: Fallow quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: bun install

      - name: Run changed-file audit
        run: bun run quality:audit

      - name: Run full quality pipeline
        run: bun run quality