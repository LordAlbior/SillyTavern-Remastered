name: CodeQL

on:
  pull_request:
    branches: [release]
  push:
    branches: [release]
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@4b266f2129161e6c66bda586888d42b13e4c1d1b # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f09a1cd056f66ee48dde54bd5914b7b3aa4f2bd3 # v3
        with:
          languages: javascript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@f09a1cd056f66ee48dde54bd5914b7b3aa4f2bd3 # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f09a1cd056f66ee48dde54bd5914b7b3aa4f2bd3 # v3